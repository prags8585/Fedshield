<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FedShieldV2 — Live Trace</title>
</head>
<body>
<style>
  :root{
    --ink:#E7ECEE; --paper:#0B1014; --steel:#AAB8C0; --steel-soft:#2B3841;
    --brass:#E7B24E; --brass-soft:#5B421E; --teal:#63C3B8; --teal-soft:#123430;
    --stamp:#E2685F; --blue:#6C9BFF; --panel-bg:rgba(99,195,184,0.07); --card-bg:#161D22;
    --text:var(--ink); --text-muted:#94A4AD; --border:var(--steel-soft);
    --mono: ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
    --sans: -apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{ --ink:#121A21; --paper:#EDF1F2; --steel:#3C4855; --steel-soft:#C7CFD6;
      --brass:#9C6B1F; --brass-soft:#E4C48A; --teal:#2E7770; --teal-soft:#BFDDD9;
      --stamp:#A6342E; --blue:#1D4ED8; --panel-bg:rgba(46,119,112,0.06); --card-bg:#FFFFFF; --text-muted:#55636F; }
  }
  :root[data-theme="light"]{ --ink:#121A21; --paper:#EDF1F2; --steel:#3C4855; --steel-soft:#C7CFD6;
    --brass:#9C6B1F; --brass-soft:#E4C48A; --teal:#2E7770; --teal-soft:#BFDDD9;
    --stamp:#A6342E; --blue:#1D4ED8; --panel-bg:rgba(46,119,112,0.06); --card-bg:#FFFFFF; --text-muted:#55636F; }
  :root[data-theme="dark"]{ --ink:#E7ECEE; --paper:#0B1014; --steel:#AAB8C0; --steel-soft:#2B3841;
    --brass:#E7B24E; --brass-soft:#5B421E; --teal:#63C3B8; --teal-soft:#123430;
    --stamp:#E2685F; --blue:#6C9BFF; --panel-bg:rgba(99,195,184,0.07); --card-bg:#161D22; --text-muted:#94A4AD; }

  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--text); font-family:var(--sans); }
  .wrap{ max-width:1560px; margin:0 auto; padding:44px 28px 60px; }

  .eyebrow{ font-family:var(--mono); font-size:19px; letter-spacing:.12em; text-transform:uppercase; color:var(--teal); font-weight:700; margin:0 0 12px; }
  h1{ font-size:clamp(24px,3vw,34px); line-height:1.14; margin:0 0 10px; white-space:nowrap; font-weight:700; letter-spacing:-.01em; }
  .sub{ font-size:15px; color:var(--text-muted); margin:0 0 20px; white-space:nowrap; }

  .badges{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
  .badge{ display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:11px; padding:5px 10px; border-radius:3px; border:1px solid var(--border); background:var(--card-bg); color:var(--text-muted); }
  .badge .dot{ width:6px; height:6px; border-radius:50%; flex:none; }
  .badge.live .dot{ background:var(--teal); }
  .badge.wip .dot{ background:var(--brass); }

  .deck{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:var(--card-bg); border:1px solid var(--border); border-radius:8px; padding:14px 18px; }
  .btnrow{ display:flex; gap:6px; flex:none; }
  button.ctl{ font-family:var(--mono); font-size:12px; letter-spacing:.02em; cursor:pointer; border:1px solid var(--border); background:var(--paper); color:var(--text); border-radius:5px; padding:8px 12px; line-height:1; transition:background .15s ease; }
  button.ctl:hover{ background:var(--panel-bg); }
  button.ctl:focus-visible{ outline:2px solid var(--teal); outline-offset:1px; }
  button.ctl.primary{ background:var(--brass); color:#1C1200; border-color:var(--brass); font-weight:700; }
  .dots{ display:flex; gap:6px; flex:none; }
  .stepdot{ width:9px; height:9px; border-radius:50%; background:var(--border); border:none; cursor:pointer; padding:0; }
  .stepdot.on{ background:var(--brass); }
  .caption{ font-size:15.5px; line-height:1.4; color:var(--text); flex:1 1 320px; min-width:240px; min-height:1.4em; }
  .caption b{ color:var(--brass); }
  .motionbtn{ margin-left:auto; flex:none; }

  .diagram-frame{ background:var(--card-bg); border:1px solid var(--border); border-top:none; border-radius:0 0 8px 8px; padding:14px 18px 22px; overflow-x:auto; }
  .diagram-frame svg{ display:block; width:100%; height:auto; }

  .node{ cursor:pointer; }
  .node .halo{ opacity:0; transition:opacity .2s ease; }
  .node:hover .halo, .node:focus-visible .halo{ opacity:.55; }
  .node:focus-visible{ outline:none; }
  .node.is-active .halo{ opacity:1; }
  .edge-live, .packet, .n-brass, .n-teal, .n-ink, .n-stamp{ transition: opacity .35s ease, filter .35s ease; }
  .is-dim{ opacity:.22; filter:grayscale(75%); }
  .is-active{ opacity:1; filter:none; }
  @media (prefers-reduced-motion:reduce){ .is-dim, .is-active{ transition:none; } }

  .n-brass{ color:var(--brass); }
  .n-teal{ color:var(--teal); }
  .n-ink{ color:var(--steel); }
  .n-stamp{ color:var(--stamp); }
  .n-muted{ color:var(--steel-soft); }

  .card{ fill:var(--paper); }
  .card-title{ font-family:var(--mono); font-size:14.5px; font-weight:700; fill:var(--text); }
  .card-sub{ font-family:var(--mono); font-size:11.5px; fill:var(--text-muted); }
  .pill-text{ font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.04em; fill:#1C1200; text-anchor:middle; }
  .tag-text{ font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; }
  .lbl-node{ font-family:var(--mono); font-size:11px; fill:var(--text-muted); text-anchor:middle; }

  .panel-bg{ fill:var(--panel-bg); stroke:var(--border); stroke-width:1.2; }
  .planned-bg{ fill:none; stroke:var(--steel-soft); stroke-width:1.2; stroke-dasharray:5 4; }
  .edge-live, .edge-static{ fill:none; }
  .edge-static{ stroke:var(--steel-soft); stroke-width:1.7; stroke-dasharray:3 4; }
  .stamp-ring{ fill:none; stroke:var(--stamp); stroke-width:3; }

  .legend{ margin-top:18px; padding-top:16px; border-top:1px solid var(--border); display:flex; flex-wrap:wrap; gap:16px 26px; align-items:center; }
  .legend-item{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-muted); }
  .legend-item svg{ flex:none; }
  .legend-note{ font-size:12px; color:var(--text-muted); font-style:italic; margin-left:auto; }

  footer{ margin-top:26px; font-family:var(--mono); font-size:11px; color:var(--text-muted); }
</style>

<script>
(function(){
  var STEPS = [
    {cap: 'Click <b>▶ Play</b>, or any card below, to follow one deposit through the system.'},
    {cap: 'Three branches. Each takes a cash deposit — <b>$8k–$9.8k</b>, just under the $10k reporting line.'},
    {cap: 'Each branch masks it into an anonymous token and scores it — and <b>flags it</b>. So does a lot of ordinary traffic.'},
    {cap: 'Only the <b>shared graph</b> can prove it’s the same money. False leads clear themselves; the real path converges.'},
    {cap: 'Autonomous agents confirm it — <b>zero human input</b>. Verdict: GUILTY.'},
    {cap: 'The verdict becomes a real <b>training label</b>. Every branch’s model gets smarter — in minutes, not months.'},
    {cap: 'Once confirmed, the Report Agent drafts an <b>Excel report</b> of the guilty transactions — a human reviews it, but that review <b>never blocks</b> the loop above. Still in progress.'}
  ];
  var N = STEPS.length;
  var current = 0;
  var playing = false;
  var timer = null;

  var svg = document.getElementById('stage');
  var captionEl = document.getElementById('caption');
  var dotsEl = document.getElementById('dots');
  var btnPlay = document.getElementById('btnPlay');
  var btnMotion = document.getElementById('btnMotion');

  for (var i = 0; i < N; i++){
    var d = document.createElement('button');
    d.className = 'stepdot' + (i === 0 ? ' on' : '');
    d.setAttribute('aria-label', 'Step ' + i);
    d.addEventListener('click', (function(idx){ return function(){ setStep(idx); stopPlay(); }; })(i));
    dotsEl.appendChild(d);
  }

  var taggedEls = Array.prototype.slice.call(svg.querySelectorAll('[data-steps]'));

  function setStep(idx){
    current = ((idx % N) + N) % N;
    captionEl.innerHTML = STEPS[current].cap;
    Array.prototype.forEach.call(dotsEl.children, function(el, i){
      el.classList.toggle('on', i === current);
    });
    taggedEls.forEach(function(el){
      var steps = el.getAttribute('data-steps').split(' ').map(Number);
      if (current === 0){
        el.classList.remove('is-dim'); el.classList.remove('is-active');
      } else if (steps.indexOf(current) !== -1){
        el.classList.add('is-active'); el.classList.remove('is-dim');
      } else {
        el.classList.add('is-dim'); el.classList.remove('is-active');
      }
    });
  }

  function next(){ setStep(current + 1); }
  function prev(){ setStep(current - 1); }

  function startPlay(){
    playing = true;
    btnPlay.textContent = '❚❚ Pause';
    timer = setInterval(next, 3200);
  }
  function stopPlay(){
    playing = false;
    btnPlay.textContent = '▶ Play';
    if (timer){ clearInterval(timer); timer = null; }
  }

  document.getElementById('btnNext').addEventListener('click', function(){ next(); stopPlay(); });
  document.getElementById('btnPrev').addEventListener('click', function(){ prev(); stopPlay(); });
  document.getElementById('btnReset').addEventListener('click', function(){ setStep(0); stopPlay(); });
  btnPlay.addEventListener('click', function(){ playing ? stopPlay() : startPlay(); });

  taggedEls.forEach(function(el){
    if (!el.classList.contains('node')) return;
    el.addEventListener('click', function(){
      var steps = el.getAttribute('data-steps').split(' ').map(Number);
      setStep(steps[0]);
      stopPlay();
    });
    el.setAttribute('role', 'button');
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var motionOn = !reduce;
  function applyMotion(){
    if (motionOn){ svg.unpauseAnimations && svg.unpauseAnimations(); btnMotion.textContent = 'Motion: on'; }
    else { svg.pauseAnimations && svg.pauseAnimations(); btnMotion.textContent = 'Motion: off'; }
  }
  btnMotion.addEventListener('click', function(){ motionOn = !motionOn; applyMotion(); });
  applyMotion();

  setStep(0);
})();
</script>
</body>
</html>
